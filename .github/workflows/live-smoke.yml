name: Live smoke test
on:
  push:
    branches: ["claude/live-smoke*"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Diagnose
        run: |
          for h in app4.breakthruventures.ai app8.breakthruventures.ai loan-portal.129-153-126-233.sslip.io habit-tracker.129-153-126-233.sslip.io; do
            echo "== $h"; dig +short A "$h"; dig +short CNAME "$h"
            curl -sS -m 20 -o /dev/null -w 'http %{http_code} -> %{redirect_url}\n' "http://$h/" || true
            curl -sS -m 20 -w ' https %{http_code}\n' "https://$h/api/health" || true
            echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "no cert"
          done
      - name: Certificates on record
        run: |
          dig +short CAA breakthruventures.ai; dig +short CAA app8.breakthruventures.ai
          curl -sS -m 60 'https://crt.sh/?q=app8.breakthruventures.ai&output=json' | jq -r '.[] | "\(.entry_timestamp) \(.issuer_name) \(.name_value)"' | head -10 || true
          echo "-- whole domain, last 7 days:"
          curl -sS -m 90 'https://crt.sh/?q=%25.breakthruventures.ai&output=json&exclude=expired' | jq -r --arg d "$(date -u -d '7 days ago' +%Y-%m-%d)" '[.[] | select(.entry_timestamp >= $d and (.issuer_name|test("Let.s Encrypt")))] | unique_by(.serial_number) | length' || true
      - name: Health
        run: |
          url="$(head -n1 .github/live-smoke-url | tr -d '[:space:]')"
          echo "url=$url" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do curl -fsS -m 30 "$url/api/health" && exit 0; sleep 20; done; exit 1
      - name: Public checks
        # The full smoke grants the underwriter role through DATABASE_URL, which a live check doesn't have.
        run: |
          set -e
          for p in / /sign-in; do curl -fsS "$url$p" | grep -q 'Explore breakthruventures.ai' && echo "ok $p"; done
          for p in /dashboard /admin; do c=$(curl -s -o /dev/null -w '%{http_code}' "$url$p"); echo "$p $c"; [ "$c" = 307 ]; done
